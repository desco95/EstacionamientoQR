<script>
  // 0) Redirigir si no viene 'type' en la URL
  (function() {
    const params = new URLSearchParams(window.location.search);
    if (!params.get('type')) {
      window.location.href = 'principal.html';
    }
  })();

  // 1. Detectar tipo desde principal.html
  const urlParams = new URLSearchParams(window.location.search);
  const userType = urlParams.get('type'); // 'student' | 'teacher' | 'admin'
  const typeDisplay = document.getElementById('type-display');
  if (userType === 'student') {
    typeDisplay.textContent = 'Estudiante';
  } else if (userType === 'teacher') {
    typeDisplay.textContent = 'Docente';
  } else if (userType === 'admin') {
    typeDisplay.textContent = 'Personal Administrativo';
  }

  const errorEl = document.getElementById('error-message');

  // 2. Validación de formato de correo y restricciones por sección
  function validarCorreo(email) {
    const partes = email.split('@');
    if (partes.length !== 2 || partes[1] !== 'leon.tecnm.mx') {
      return { ok: false, msg: 'Debes usar un correo @leon.tecnm.mx' };
    }
    const local = partes[0];

    if (userType === 'student') {
      // Sólo dígitos permitidos
      if (!/^\d+$/.test(local)) {
        return {
          ok: false,
          msg: 'En la sección Alumno sólo se permiten números (tu matrícula).'
        };
      }
    } else {
      // teacher/admin: No sólo dígitos (debe contener al menos una letra)
      if (/^\d+$/.test(local)) {
        return {
          ok: false,
          msg: 'En la sección Docente/Administrativo debes usar letras y/o caracteres (no sólo números).'
        };
      }
    }

    return { ok: true };
  }

  // 5. Google Sign-In con restricción de formato
  document.getElementById('google-login-btn')
    .addEventListener('click', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({
        hd: 'leon.tecnm.mx',
        prompt: 'select_account'
      });

      try {
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;

        // 5.1 Verifica dominio
        if (!user.email.endsWith('@leon.tecnm.mx')) {
          errorEl.textContent = 'Solo correos institucionales @leon.tecnm.mx';
          await firebase.auth().signOut();
          return;
        }

        // 5.2 Aplica la misma validación de localpart según sección
        const { ok, msg } = validarCorreo(user.email);
        if (!ok) {
          errorEl.textContent = msg;
          await firebase.auth().signOut();
          return;
        }

        // 5.3 Si todo bien, continúa
        const token = await user.getIdToken();
        window.location.href =
          `usuario.html?type=${encodeURIComponent(userType)}&token=${token}`;

      } catch (err) {
        console.error(err);
        errorEl.textContent = err.message;
      }
    });

 
  // 6. Google Logout (igual que antes)
  document.getElementById('google-logout-btn')
    .addEventListener('click', async () => {
      await firebase.auth().signOut();
      window.open('https://accounts.google.com/Logout','_blank');
      setTimeout(() => location.href = 'login.html', 400);
    });
