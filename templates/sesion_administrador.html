<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Administrador</title>
    <link rel="stylesheet" href="../static/styles_sesion_administrador.css">
</head>
<body>
    <div class="admin-session-container">
        <div class="logo-section">
            <img src="../static/LOGO INICIO SESION.png" alt="Logo Inicio Sesión">
        </div>

        <div class="form-section">
            <div class="header">
                <div class="header-title">INSTITUTO TECNOLÓGICO<br>DE LEÓN</div>
                <img src="../static/LOGO ITL.png" alt="Logo ITL" onclick="location.href='principal.html'">
            </div>

            <div class="subtitle">ESTACIONAMIENTO CAMPUS I</div>
            <div class="admin-access">Acceso de Administrador</div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>
                </div>

                <div class="button-row">
                    <div></div>
                    <div><button type="submit" class="enter-button">Entrar</button></div>
                    <div><button type="button" class="back-button" onclick="location.href='principal.html'">Volver al inicio</button></div>
                </div>
            </form>
            
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;
            const errorElement = document.getElementById('error-message');

            try {
                const response = await fetch("http://127.0.0.1:5000/api/admin/login", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usuario,
                        password: contrasena
                    })
                });

                const data = await response.json();

                if (response.ok && data.success && data.role) {
                    // Guarda el rol y el usuario en localStorage
                    localStorage.setItem('admin_role', data.role);
                    localStorage.setItem('admin_username', usuario);

                    window.location.href = 'administrador.html';
                } else {
                    errorElement.textContent = data.error || 'Credenciales incorrectas';
                }
            } catch (error) {
                errorElement.textContent = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
